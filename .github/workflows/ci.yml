name: CI

# Runs the same quality gates that were previously only manual. The beta.4
# stale-sidecar regression shipped because nothing automated enforced these.
# Scope: backend tests + frontend tests/typecheck/build. The Windows installer +
# PyInstaller sidecar freeze stay manual (see docs/RELEASE_CHECKLIST.md) — they
# need a Windows runner + Rust + PyInstaller and are release-time concerns.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Test
        run: python -m pytest -q

      # The same command a reviewer runs to see the pipeline work end to end.
      # It exercises production code paths on a generated project and exits
      # non-zero on any failure, so a broken pipeline fails the build even if
      # every unit test still passes.
      - name: Self-check (end-to-end pipeline)
        run: python -m u1convert.cli selfcheck

  shell:
    name: Desktop shell (cargo check)
    # 500+ lines of Rust own the security boundary — the model-site allowlist, the
    # tool-launch table, the sidecar job object. Nothing was verifying it.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Tauri declares the frozen Python engine as an external binary, and its
      # build script refuses to run if that file is missing — so this job failed
      # on every commit from the day it was added, because CI does not freeze the
      # sidecar. `cargo check` never reads the file's contents; it only needs the
      # resource to resolve. A zero-byte placeholder is enough to type-check the
      # Rust, and the real engine is frozen and verified at release time by
      # `npm run release:windows` and the installed-build acceptance harness.
      - name: Placeholder for the sidecar cargo check only needs to resolve
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          New-Item -ItemType File -Force -Path bin/snapstudio-api-x86_64-pc-windows-msvc.exe | Out-Null
        shell: pwsh
      - name: Check
        run: cargo check --all-targets

  frontend:
    name: Frontend (vitest + tsc + build)
    # Windows runner matches the product target (Windows-only desktop app) and
    # the Windows-authored package-lock.json, so `npm ci` is reproducible.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npx vite build
