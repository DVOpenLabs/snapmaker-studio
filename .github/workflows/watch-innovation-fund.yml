name: Watch the Innovation Fund page

# Twenty per cent of the Phase 1 score was a community vote whose system did
# not exist when the entry was listed, and there was no notification channel
# that reached an entrant when it launched. This script's job was to notice
# that. It did: the vote was observed live on 2026-09-23 (issue #18, opened by
# this watcher, closed by the maintainer the same day). The schedule is
# retired in this change; the script itself refuses to re-alert once the
# recorded snapshot shows `voting_live: true`. `workflow_dispatch` stays for a
# manual check.
#
# At most one GET per run. Nothing here votes, submits, or interacts with the
# site.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check for the voting system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compare the page against the recorded signals
        id: check
        run: |
          set +e
          out=$(python tools/watch/innovation_fund.py 2>&1)
          code=$?
          echo "$out"
          {
            echo "report<<EOF"
            echo "$out"
            echo "EOF"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          # 0 = no change (or terminal); 2 = a watched signal changed, the next
          # step opens or updates an issue. 1 = the page or snapshot could not
          # be read, which is a real failure worth a red run in the log.
          if [ "$code" = "0" ] || [ "$code" = "2" ]; then
            exit 0
          fi
          exit 1

      - name: Open or update an issue when a signal changes
        if: steps.check.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report }}
          TITLE: "Innovation Fund page changed - check whether project voting is live"
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "A manual run of the page watcher saw a change in the signals it tracks on"
            echo "<https://www.snapmaker.com/innovation-fund>."
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
            echo
            echo "If the project-voting system has launched:"
            echo
            echo "- Record the legitimate voting path in \`docs/innovation-fund/BETA_TEST_PLAN.md\`."
            echo "- Do **not** automate, solicit or coordinate votes. Linking the project page once, factually, is the limit."
            echo "- Refresh the snapshot with \`python tools/watch/innovation_fund.py --update\`."
          } > issue-body.md
          existing=$(gh issue list --state open --limit 100 --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi
