name: Release candidate (Windows + Linux)

# v1.0.0 release-prep. Builds BOTH platforms from the exact code on the
# dispatched ref, runs the Windows default-path upgrade smoke test against
# it, and writes a manifest naming both artifacts' names/sizes/hashes plus
# this run's own id/URL — the maintainer/agent copies those four values
# into docs/RELEASE_METADATA.md's "Build run" row. Nothing here publishes
# anything: this is the "build once, verify locally" half of the
# build-once/verify-locally/promote-exact-bytes architecture
# (docs/internal/LINUX_BETA_PLAN.md L11) — release-publish.yml, the ONLY
# tag-triggered workflow, later promotes these SAME bytes without rebuilding.
#
# Must be present on the default branch before it can be dispatched (a
# GitHub Actions constraint on workflow_dispatch-triggered workflows) — this
# file, release.yml's and release-linux.yml's workflow_call additions, and
# release-publish.yml all land on main together in one PR before any
# release/vX.Y.Z branch tries to dispatch this.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read

  linux:
    uses: ./.github/workflows/release-linux.yml
    permissions:
      contents: read

  windows-upgrade-smoke:
    name: Windows upgrade smoke test (default install path)
    if: github.repository == 'DVOpenLabs/snapmaker-studio'
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Helper integrity assumes the checked-out repository is the source of these scripts.
      - name: Check out helper scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the release-candidate installer
        uses: actions/download-artifact@v4
        with:
          name: snapmaker-studio-installer
          path: rc

      - name: Download the published v1.5.0 installer, verify its checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or [string]::IsNullOrWhiteSpace($env:ImageOS) -or $env:GITHUB_REPOSITORY -ne 'DVOpenLabs/snapmaker-studio' `
          -or $env:ACT -or $env:WDAGUtilityAccount) { throw 'Disposable preflight failed.' }
          $url = "https://github.com/DVOpenLabs/snapmaker-studio/releases/download/v1.5.0/Snapmaker.Studio_1.5.0_x64-setup.exe"
          $dest = "old\Snapmaker.Studio_1.5.0_x64-setup.exe"
          New-Item -ItemType Directory -Force -Path old | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $dest
          $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
          $expected = "d443f64f5167239f1422c719882cf245cff5d00d40c55fb67fc5a1e497b84e82"
          if ($hash -ne $expected) {
            throw "Downloaded v1.5.0 installer hash $hash does not match the published $expected"
          }
          Write-Host "v1.5.0 installer verified: $hash"

      - name: Install v1.5.0 (default path), record its registration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or [string]::IsNullOrWhiteSpace($env:ImageOS) -or $env:GITHUB_REPOSITORY -ne 'DVOpenLabs/snapmaker-studio' `
          -or $env:ACT -or $env:WDAGUtilityAccount) { throw 'Disposable preflight failed.' }
          $userKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Snapmaker Studio'
          $machine64Key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Snapmaker Studio'
          $machine32Key = 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Snapmaker Studio'
          $rememberedKey = 'HKCU:\Software\DeadlyVirusIn / Snapmaker Studio\Snapmaker Studio'
          $manufacturerKey = 'HKCU:\Software\DeadlyVirusIn / Snapmaker Studio'
          $defaultExe = Join-Path $env:LOCALAPPDATA 'Snapmaker Studio\snapmaker-studio-desktop.exe'
          if ((Test-Path -LiteralPath $userKey) -or (Test-Path -LiteralPath $machine64Key) -or (Test-Path -LiteralPath $machine32Key) -or (Test-Path -LiteralPath $rememberedKey) -or (Test-Path `
          -LiteralPath $manufacturerKey) -or (Test-Path -LiteralPath $defaultExe) -or (Get-Process -Name 'snapmaker-studio-desktop' -ErrorAction SilentlyContinue)) { throw `
          'Initial exact production state is not clean.' }
          $old = (Resolve-Path "old\Snapmaker.Studio_1.5.0_x64-setup.exe").Path
          $p = Start-Process -FilePath $old -ArgumentList '/S', '/NCRC' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "v1.5.0 silent install failed, exit $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          $beforePath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Snapmaker Studio'
          if (-not (Test-Path -LiteralPath $beforePath)) { throw 'Exact v1.5.0 registration is absent' }
          $beforeProps = Get-ItemProperty -LiteralPath $beforePath
          if ($beforeProps.DisplayVersion -ne "1.5.0") { throw "v1.5.0 registration says DisplayVersion=$($beforeProps.DisplayVersion), expected 1.5.0" }
          # NSIS can write InstallLocation wrapped in literal quote
          # characters (part of the string value itself, not just how it
          # displays) — trim them unconditionally so every later
          # Test-Path/Join-Path against this value uses a real path. A
          # value with no quotes is untouched by Trim.
          $installLocation = $beforeProps.InstallLocation.Trim('"')
          "install_location=$installLocation" >> $env:GITHUB_ENV
          "owned_install_dir=$installLocation" >> $env:GITHUB_ENV
          $ownedUninstaller = Join-Path $installLocation 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $ownedUninstaller)) { throw "Owned uninstaller not found at $ownedUninstaller" }
          if (([string]$beforeProps.UninstallString -replace '"', '') -ne $ownedUninstaller) { throw 'Recorded uninstall string does not equal the owned uninstaller path.' }
          if ($installLocation -ne (Join-Path $env:LOCALAPPDATA 'Snapmaker Studio')) { throw 'First install did not use the exact default path.' }
          "owned_uninstaller=$ownedUninstaller" >> $env:GITHUB_ENV
          "owned_uninstaller_sha256=$((Get-FileHash -LiteralPath $ownedUninstaller -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV
          Write-Host "v1.5.0 installed at $installLocation, DisplayVersion 1.5.0"
          pwsh -NoProfile -File .github/scripts/ci-assert-registry.ps1 -Action Assert -InstallDir $installLocation -OutFile $env:RUNNER_TEMP\rc-before.json
          if ($LASTEXITCODE -ne 0) { throw 'Registry assertion failed.' }

      - name: Assert previous install shortcuts
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or [string]::IsNullOrWhiteSpace($env:ImageOS) -or $env:GITHUB_REPOSITORY -ne 'DVOpenLabs/snapmaker-studio' `
          -or $env:ACT -or $env:WDAGUtilityAccount) { throw 'Disposable preflight failed.' }
          pwsh -NoProfile -File .github/scripts/ci-assert-shortcuts.ps1 -Action Assert -ExpectedAumid com.snapmakerstudio.desktop -StartMenuDir "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" `
          -DesktopDir ([Environment]::GetFolderPath('Desktop')) -InstallDir $env:owned_install_dir -OutFile $env:RUNNER_TEMP\rc-before-shortcuts.json
          if ($LASTEXITCODE -ne 0) { throw 'Shortcut assertion failed.' }

      - name: Install the release candidate over it (default path, same key)
        shell: pwsh
        env:
          EXPECTED_RC_SHA256: ${{ needs.windows.outputs.installer_sha256 }}
          EXPECTED_RC_INSTALLER_NAME: ${{ needs.windows.outputs.installer_name }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or [string]::IsNullOrWhiteSpace($env:ImageOS) -or $env:GITHUB_REPOSITORY -ne 'DVOpenLabs/snapmaker-studio' `
          -or $env:ACT -or $env:WDAGUtilityAccount) { throw 'Disposable preflight failed.' }
          if ($env:EXPECTED_RC_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Missing needs.windows installer digest.' }
          $rc = Get-Item (Join-Path 'rc' $env:EXPECTED_RC_INSTALLER_NAME)
          $rcVersion = if ($rc.Name -match '_([0-9]+\.[0-9]+\.[0-9]+[^_]*)_') { $matches[1] } else { $null }
          if ($null -eq $rcVersion) { throw "Could not parse a version out of RC installer filename $($rc.Name)" }
          if ((Get-FileHash -LiteralPath $rc.FullName -Algorithm SHA256).Hash -ne $env:EXPECTED_RC_SHA256) { throw 'Downloaded RC bytes do not match needs.windows.outputs.installer_sha256.' }
          $beforeRcProps = Get-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Snapmaker Studio'
          $beforeRcLocation = ([string]$beforeRcProps.InstallLocation).Trim('"')
          $beforeRcUninstall = ([string]$beforeRcProps.UninstallString -replace '"', '')
          if ($beforeRcLocation -ne $env:owned_install_dir -or $beforeRcUninstall -ne $env:owned_uninstaller) { throw 'Recorded ownership changed before RC install.' }
          $p = Start-Process -FilePath $rc.FullName -ArgumentList '/S', '/NCRC' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "RC silent install failed, exit $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          $afterPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Snapmaker Studio'
          if (-not (Test-Path -LiteralPath $afterPath)) { throw 'Exact RC registration is absent' }
          $afterProps = Get-ItemProperty -LiteralPath $afterPath
          if ($afterProps.DisplayVersion -ne $rcVersion) {
            throw "Registration says DisplayVersion=$($afterProps.DisplayVersion) after installing the RC, expected $rcVersion"
          }
          $afterLocation = $afterProps.InstallLocation.Trim('"')
          if (([string]$afterProps.UninstallString -replace '"', '') -ne $env:owned_uninstaller) { throw 'RC upgrade changed recorded uninstall ownership.' }
          if ($afterLocation -ne $env:owned_install_dir) {
            throw "InstallLocation changed from $env:install_location to $afterLocation — should be the SAME location (in-place upgrade)"
          }
          $legacyKey = 'HKCU:\Software\DeadlyVirusIn / Snapmaker Studio\Snapmaker Studio'
          if (-not (Test-Path $legacyKey)) {
            throw "Legacy publisher registry key $legacyKey is gone — bundle.publisher must stay unchanged for upgrade detection"
          }
          $exe = Join-Path $afterLocation "snapmaker-studio-desktop.exe"
          if (-not (Test-Path $exe)) {
            throw "Installed exe not found at $exe"
          }
          $ver = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "Installed exe FileVersion: $ver"
          Write-Host "Upgrade verified: one registration, DisplayVersion $rcVersion, same InstallLocation ($afterLocation), legacy publisher key present."
          pwsh -NoProfile -File .github/scripts/ci-assert-registry.ps1 -Action Assert -InstallDir $afterLocation -OutFile $env:RUNNER_TEMP\rc-after.json
          if ($LASTEXITCODE -ne 0) { throw 'Post-upgrade registry assertion failed.' }
          "owned_uninstaller_sha256=$((Get-FileHash -LiteralPath $env:owned_uninstaller -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV

      - name: Capture release-candidate installed-tree manifest
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or [string]::IsNullOrWhiteSpace($env:ImageOS) -or $env:GITHUB_REPOSITORY -ne 'DVOpenLabs/snapmaker-studio' `
          -or $env:ACT -or $env:WDAGUtilityAccount) { throw 'Disposable preflight failed.' }
          pwsh -NoProfile -File .github/scripts/ci-assert-manifest.ps1 -InstallDir $env:owned_install_dir -OutFile $env:RUNNER_TEMP\release-candidate-installed-tree.json
          if ($LASTEXITCODE -ne 0) { throw 'Manifest assertion failed.' }

      - name: Upload release-candidate installed-tree manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-installed-tree
          path: ${{ runner.temp }}/release-candidate-installed-tree.json
          if-no-files-found: error

      - name: Uninstall, verify the machine is clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or [string]::IsNullOrWhiteSpace($env:ImageOS) -or $env:GITHUB_REPOSITORY -ne 'DVOpenLabs/snapmaker-studio' `
          -or $env:ACT -or $env:WDAGUtilityAccount) { throw 'Disposable preflight failed.' }
          $regPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Snapmaker Studio'
          if (-not (Test-Path -LiteralPath $regPath)) { throw 'Exact uninstall registration is absent' }
          $props = Get-ItemProperty -LiteralPath $regPath
          $uninstallString = $props.UninstallString -replace '"', ''
          if ($uninstallString -ne $env:owned_uninstaller -or $uninstallString -ne (Join-Path $env:owned_install_dir 'uninstall.exe')) { throw 'Uninstaller is not the recorded owned path.' }
          if ((Get-FileHash -LiteralPath $env:owned_uninstaller -Algorithm SHA256).Hash -ne $env:owned_uninstaller_sha256) { throw 'Owned uninstaller hash changed.' }
          $p = Start-Process -FilePath $env:owned_uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Uninstall failed, exit $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path -LiteralPath $regPath) { throw 'Uninstall left the exact registration behind' }
          if (Test-Path $env:owned_install_dir) { throw "Uninstall left $env:owned_install_dir behind" }
          pwsh -NoProfile -File .github/scripts/ci-assert-registry.ps1 -Action Assert -AfterUninstall -InstallDir $env:owned_install_dir -OutFile $env:RUNNER_TEMP\rc-after-uninstall.json
          if ($LASTEXITCODE -ne 0) { throw 'Post-uninstall registry assertion failed.' }
          pwsh -NoProfile -File .github/scripts/ci-assert-shortcuts.ps1 -Action AssertAbsent -ExpectedAumid com.snapmakerstudio.desktop -StartMenuDir `
          "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -DesktopDir ([Environment]::GetFolderPath('Desktop')) -InstallDir $env:owned_install_dir -OutFile `
          $env:RUNNER_TEMP\rc-after-uninstall-shortcuts.json
          if ($LASTEXITCODE -ne 0) { throw 'Post-uninstall shortcut assertion failed.' }
          Write-Host "Uninstalled cleanly: no registration, no install directory."

  manifest:
    name: Release-candidate manifest
    needs: [windows, linux, windows-upgrade-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write the manifest
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WINDOWS_INSTALLER: ${{ needs.windows.outputs.installer_name }}
          WINDOWS_SIZE: ${{ needs.windows.outputs.installer_size }}
          WINDOWS_SHA256: ${{ needs.windows.outputs.installer_sha256 }}
          LINUX_DEB: ${{ needs.linux.outputs.deb_name }}
          LINUX_SIZE: ${{ needs.linux.outputs.deb_size }}
          LINUX_SHA256: ${{ needs.linux.outputs.deb_sha256 }}
        run: |
            @(
              '# Release-candidate manifest'
              "source_commit: $env:SOURCE_COMMIT"
              "source_ref: $env:SOURCE_REF"
              "run_id: $env:RUN_ID"
              "run_url: $env:RUN_URL"
              ''
              "windows_installer: $env:WINDOWS_INSTALLER"
              "windows_size: $env:WINDOWS_SIZE"
              "windows_sha256: $env:WINDOWS_SHA256"
              ''
              "linux_deb: $env:LINUX_DEB"
              "linux_size: $env:LINUX_SIZE"
              "linux_sha256: $env:LINUX_SHA256"
            ) | Tee-Object -FilePath RELEASE_CANDIDATE.txt

      - name: Upload the manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-manifest
          path: RELEASE_CANDIDATE.txt
          if-no-files-found: error
