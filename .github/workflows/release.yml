name: Release build (Windows installer)

# Build-only Windows release-candidate workflow: it always re-freezes the
# PyInstaller sidecar, builds the NSIS installer, and SMOKE-TESTS the
# freshly-bundled sidecar's endpoints before uploading the artifact. If any
# required endpoint 404s (i.e. the bundled sidecar is stale/missing a
# route), the job fails and no artifact ships. Closes the beta.4
# stale-sidecar bug class in tooling, not just the manual checklist.
#
# Does NOT auto-publish a GitHub Release or sign the installer (signing needs
# a certificate — see docs/windows-code-signing.md). It uploads the
# installer as a build artifact only.
#
# v1.0.0 release-prep: no longer tag-triggered. `release-candidate.yml`
# calls this via `workflow_call` (plus `release-publish.yml`, the ONLY
# tag-triggered workflow, promotes the exact bytes this produces — never
# rebuilds). `workflow_dispatch` stays for standalone manual builds.

on:
  workflow_dispatch: {}
  workflow_call:
    outputs:
      installer_name:
        description: "The built installer's filename (dotted form, matching the published asset name)"
        value: ${{ jobs.windows-installer.outputs.installer_name }}
      installer_size:
        description: "The built installer's size in bytes"
        value: ${{ jobs.windows-installer.outputs.installer_size }}
      installer_sha256:
        description: "The built installer's SHA256"
        value: ${{ jobs.windows-installer.outputs.installer_sha256 }}

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    outputs:
      installer_name: ${{ steps.hash.outputs.installer_name }}
      installer_size: ${{ steps.hash.outputs.installer_size }}
      installer_sha256: ${{ steps.hash.outputs.installer_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Node.js security floor
        run: node "${{ github.workspace }}/scripts/check-node-floor.mjs"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install backend + freeze deps
        run: |
          python -m pip install --upgrade pip
          pip install -e backend
          pip install -r backend/requirements-build.txt

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Freeze sidecar (always fresh)
        working-directory: desktop
        run: pwsh ./scripts/build-sidecar.ps1

      # Build provenance. This RECORDS what the build used; it does not pin it:
      # the Rust toolchain, Python packages and runner image still float, so the
      # recorded versions are facts about this run, not reproducible inputs.
      # What is enforced: the build runs with `--locked`, and the job fails if
      # either lockfile differs afterwards.
      - name: Record build provenance (inputs, before the build)
        id: prov_pre
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = Join-Path $env:RUNNER_TEMP "build-provenance"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "PROVENANCE_DIR=$dir" >> $env:GITHUB_ENV
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) { throw "Tracked files differ from the checked-out commit before the build: $dirty" }
          $locks = @("desktop/src-tauri/Cargo.lock", "desktop/package-lock.json")
          $locks | ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_).Hash.ToLower(), $_ } | Set-Content -Encoding utf8 (Join-Path $dir "lockfiles-before.txt")
          @("commit=$(git rev-parse HEAD)", "tree=$(git rev-parse 'HEAD^{tree}')", "ref=$env:GITHUB_REF", "run_id=$env:GITHUB_RUN_ID") | Set-Content -Encoding utf8 (Join-Path $dir "source.txt")
          $tools = @("runner_os=$env:RUNNER_OS", "runner_arch=$env:RUNNER_ARCH", "image_os=$env:ImageOS", "image_version=$env:ImageVersion", "node=$(node -v)", "npm=$(npm -v)", "python=$(python -VV)", "cargo=$(cargo -V)")
          $tools += (rustc -vV | ForEach-Object { "rustc: $_" })
          Push-Location desktop
          $tools += "tauri_cli=$(npx tauri --version)"
          Pop-Location
          $tools | Set-Content -Encoding utf8 (Join-Path $dir "toolchain.txt")
          python -m pip list --format=json | Set-Content -Encoding utf8 (Join-Path $dir "python-packages.json")
          $metaPath = Join-Path $dir "cargo-metadata.json"
          cargo metadata --locked --format-version 1 --manifest-path desktop/src-tauri/Cargo.toml | Set-Content -Encoding utf8 $metaPath
          $meta = Get-Content -Raw $metaPath | ConvertFrom-Json
          $graph = @($meta.packages | ForEach-Object { "{0} {1} {2}" -f $_.name, $_.version, $(if ($_.source) { $_.source } else { "path" }) } | Sort-Object)
          $graphPath = Join-Path $dir "cargo-resolved-packages.txt"
          $graph | Set-Content -Encoding utf8 $graphPath
          "{0}  cargo-resolved-packages.txt ({1} packages)" -f (Get-FileHash -Algorithm SHA256 $graphPath).Hash.ToLower(), $graph.Count | Set-Content -Encoding utf8 (Join-Path $dir "cargo-resolved-packages.sha256")
          Get-Content (Join-Path $dir "lockfiles-before.txt")

      - name: Build installer
        working-directory: desktop
        run: npx tauri build -- --locked

      - name: Verify the lockfiles were not changed by the build
        if: ${{ always() && steps.prov_pre.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = $env:PROVENANCE_DIR
          $locks = @("desktop/src-tauri/Cargo.lock", "desktop/package-lock.json")
          $locks | ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_).Hash.ToLower(), $_ } | Set-Content -Encoding utf8 (Join-Path $dir "lockfiles-after.txt")
          "build_command=npx tauri build -- --locked" | Set-Content -Encoding utf8 (Join-Path $dir "build-command.txt")
          Get-Content (Join-Path $dir "lockfiles-after.txt")
          if (Compare-Object (Get-Content (Join-Path $dir "lockfiles-before.txt")) (Get-Content (Join-Path $dir "lockfiles-after.txt"))) { throw "A lockfile changed during the build." }
          git diff --exit-code -- desktop/src-tauri/Cargo.lock desktop/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw "A lockfile differs from the checked-out commit after the build." }
          "lockfiles_unchanged=true" | Add-Content -Encoding utf8 (Join-Path $dir "build-command.txt")

      - name: Smoke-test the BUNDLED sidecar endpoints
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sc = "desktop/src-tauri/bin/snapstudio-api-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sc)) { throw "bundled sidecar not found: $sc" }
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $sc; $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false; $psi.CreateNoWindow = $true
          $env:SNAPSTUDIO_API_PORT = "8910"
          $p = [System.Diagnostics.Process]::Start($psi)
          $hs = $p.StandardOutput.ReadLine() | ConvertFrom-Json
          $hdr = @{ "X-Auth-Token" = $hs.token; "Content-Type" = "application/json" }
          function Code($path, $body) {
            try { (Invoke-WebRequest -Uri "http://127.0.0.1:$($hs.port)$path" -Method POST -Headers $hdr -Body $body -UseBasicParsing -TimeoutSec 10).StatusCode }
            catch { $_.Exception.Response.StatusCode.value__ }
          }
          $health = (Invoke-WebRequest -Uri "http://127.0.0.1:$($hs.port)/health" -UseBasicParsing -TimeoutSec 10).StatusCode
          $routes = @{
            "/plate_inspect"       = '{"path":"none"}'
            "/compatibility_check" = '{"path":"none"}'
            "/scale_preview"       = '{"path":"none","scale_percent":100}'
            "/model_search"        = '{"query":"x"}'
            "/quality_check"       = '{"symptom":"stringing"}'
            "/first_layer_check"   = '{"symptom":"not_stick"}'
          }
          $fail = @()
          if ($health -ne 200) { $fail += "/health=$health" }
          foreach ($r in $routes.GetEnumerator()) {
            $c = Code $r.Key $r.Value
            Write-Host "$($r.Key) => $c"
            if ($c -eq 404) { $fail += "$($r.Key)=404 (stale sidecar)" }
          }
          $p.Kill()
          if ($fail.Count -gt 0) { throw "bundled-sidecar smoke FAILED: $($fail -join ', ')" }
          Write-Host "bundled-sidecar smoke OK"

      - name: Frozen-sidecar SpoolEase proof (pytest against the bundled exe)
        working-directory: backend
        env:
          SNAPSTUDIO_SIDECAR_EXE: ${{ github.workspace }}\desktop\src-tauri\bin\snapstudio-api-x86_64-pc-windows-msvc.exe
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest tests/test_frozen_sidecar_spoolease.py -q -p no:cacheprovider

      - name: Rename to the dotted form GitHub publishes assets under, then hash
        # Tauri's NSIS bundler names the file with a space
        # ("Snapmaker Studio_<v>_x64-setup.exe"); GitHub has always renamed
        # the space to a dot on upload to a Release, so every past
        # published asset is actually "Snapmaker.Studio_<v>_x64-setup.exe"
        # (confirmed against every prior release). Renaming here BEFORE
        # hashing/uploading means the artifact name, the published asset
        # name, and the hash all refer to the exact same bytes under the
        # exact same name — nothing renames or re-hashes downstream.
        id: hash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          $dotted = $src.Name -replace " ", "."
          $dest = Join-Path $src.DirectoryName $dotted
          Move-Item -Path $src.FullName -Destination $dest
          $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
          $size = (Get-Item $dest).Length
          "$hash  $dotted  $size bytes"
          "installer_name=$dotted" >> $env:GITHUB_OUTPUT
          "installer_size=$size" >> $env:GITHUB_OUTPUT
          "installer_sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapmaker-studio-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: error

      - name: Upload build provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-provenance-windows
          path: ${{ runner.temp }}/build-provenance
          if-no-files-found: warn
          retention-days: 90
